<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Project</title>
  </head>
  <body>
    <button id="authBtn">Login</button>

    <h2>Stores</h2>

    <form autocomplete="on">
      <label for="Addname">Store name</label>
      <input id="Addname" name="name" placeholder="Store name" />

      <label for="Adddistrict">District</label>
      <input id="Adddistrict" name="district" placeholder="District" />

      <label for="Addurl">URL</label>
      <input id="Addurl" name="url" placeholder="URL" />

      <label for="Addcategory">Category</label>
      <input id="Addcategory" name="category" placeholder="Category" />

      <button type="button" onclick="createStore()">Add Store</button>
    </form>

    <h5>Sort Stores</h5>
    <select id="sortField">
      <option value="name">Name</option>
      <option value="district">District</option>
      <option value="url">URL</option>
      <option value="category">Category</option>
    </select>

    <select id="sortOrder">
      <option value="asc">Ascending</option>
      <option value="desc">Descending</option>
    </select>
    <button id="sortBtn">Sort</button>
    <div id="container"></div>
    <script src="./index.js"></script>
  </body>
</html>
